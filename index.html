/* ════════════════════════════════════════════════════════════════════
   CROSS-TAB GRID  (rows × column-values, e.g. State × Model)
   ════════════════════════════════════════════════════════════════════ */
// Builds { grand, colKeys, rowKeys, rowAggs } from a 3-dim compact matrix.
// rowPos/colPos/lmPos are the index positions within a row.
function buildCrossAgg(table, maps, rowMapKey, colMapKey, lmMapKey, rowPos, colPos, lmPos, monthSet, rowFilter, colFilter, getLR, rtCols) {
  const allM   = !monthSet  || monthSet.size  === 0;
  const allRow = !rowFilter || rowFilter.size === 0;
  const allCol = !colFilter || colFilter.size === 0;
  let gL=0,gR=0,gDm=0,gCo=0;
  const rowAcc = new Map();
  const colTotals = {};
  const allCols = new Set();
  for (const row of table) {
    const m = maps[lmMapKey][row[lmPos]];
    if (!allM && !monthSet.has(m)) continue;
    const rLabel = maps[rowMapKey][row[rowPos]];
    if (!allRow && !rowFilter.has(rLabel)) continue;
    const cLabel = maps[colMapKey][row[colPos]];
    if (!allCol && !colFilter.has(cLabel)) continue;
    const [l,r] = getLR(row);
    const dm = rtCols ? (row[row.length-2]||0) : 0;
    const co = rtCols ? (row[row.length-1]||0) : 0;
    gL+=l; gR+=r; gDm+=dm; gCo+=co;
    allCols.add(cLabel);
    colTotals[cLabel]=(colTotals[cLabel]||0)+l;
    if (!rowAcc.has(rLabel)) rowAcc.set(rLabel,{total:[0,0,0,0],colAggs:new Map()});
    const e=rowAcc.get(rLabel);
    e.total[0]+=l; e.total[1]+=r; e.total[2]+=dm; e.total[3]+=co;
    if (!e.colAggs.has(cLabel)) e.colAggs.set(cLabel,[0,0,0,0]);
    const ca=e.colAggs.get(cLabel);
    ca[0]+=l; ca[1]+=r; ca[2]+=dm; ca[3]+=co;
  }
  const colKeys=[...allCols].sort((a,b)=>(colTotals[b]||0)-(colTotals[a]||0));
  const rowEntries=[...rowAcc.entries()].sort((a,b)=>b[1].total[0]-a[1].total[0]);
  const rowKeys=rowEntries.map(([k])=>k);
  const rowAggs={};
  for (const [rk,e] of rowEntries) {
    const ca={};
    for (const [ck,v] of e.colAggs) ca[ck]={l:v[0],r:v[1],dm:v[2],co:v[3],l2r:v[0]>0?v[1]/v[0]*100:0};
    rowAggs[rk]={total:{l:e.total[0],r:e.total[1],dm:e.total[2],co:e.total[3],l2r:e.total[0]>0?e.total[1]/e.total[0]*100:0},colAggs:ca};
  }
  return {grand:{l:gL,r:gR,dm:gDm,co:gCo,l2r:gL>0?gR/gL*100:0},colKeys,rowKeys,rowAggs};
}

// CrossTabGrid: renders a state/city × model cross-tabulation
const CrossTabGrid = React.memo(function CrossTabGrid({ agg, rowLabel, colLabel, rtCols, onExport, title }) {
  if (!agg || agg.grand.l===0) return null;
  const {grand,colKeys,rowKeys,rowAggs}=agg;
  const showRT=!!rtCols;
  const totalColSpan=showRT?6:4;
  const colGrandL=ck=>{let t=0;for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck];if(ca)t+=ca.l;}return t;};
  const colGrandR=ck=>{let t=0;for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck];if(ca)t+=ca.r;}return t;};
  return ce('div',null,
    title && ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}},
      ce('div',{className:'section-title',style:{marginBottom:0}},title),
      onExport && ce(ExportBtn,{onClick:onExport})
    ),
    ce('div',{className:'scroll-x'},
      ce('table',null,
        ce('thead',null,
          ce('tr',null,
            ce('th',{className:'left',rowSpan:2,style:{minWidth:160,position:'sticky',left:0,zIndex:3,background:'#E8EAF6',color:'#1A237E'}},rowLabel),
            ce('th',{colSpan:totalColSpan,style:{background:'#E8EAF6',color:'#1A237E'}},'TOTAL'),
            ...colKeys.map(ck=>ce('th',{key:ck,colSpan:3,style:{borderLeft:'2px solid #BFDBFE',background:'#F3F4F6',whiteSpace:'nowrap',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis'}},ck))
          ),
          ce('tr',null,
            ce('th',{className:'sub'},'Leads'),
            ce('th',{className:'sub'},'Retail'),
            ce('th',{className:'sub'},'Contrib%'),
            ce('th',{className:'sub',style:{color:'#D97706'}},'L2R%'),
            ...(showRT?[ce('th',{className:'sub',style:{color:'#7C3AED'}},'DMS'),ce('th',{className:'sub',style:{color:'#0891B2'}},'Call Out')]:[]),
            ...colKeys.flatMap(ck=>[
              ce('th',{key:ck+'l',className:'sub',style:{borderLeft:'2px solid #BFDBFE'}},'Leads'),
              ce('th',{key:ck+'r',className:'sub'},'Retail'),
              ce('th',{key:ck+'l2r',className:'sub',style:{color:'#D97706'}},'L2R%'),
            ])
          )
        ),
        ce('tbody',null,
          ...rowKeys.map(rk=>{
            const da=rowAggs[rk];
            return ce('tr',{key:rk},
              ce('td',{className:'label',style:{position:'sticky',left:0,background:'#FAFAFA',zIndex:1}},rk),
              ce('td',null,Nf(da.total.l)),
              ce('td',{style:{color:'#E31837',fontWeight:700}},Nf(da.total.r)),
              ce('td',null,grand.l>0?Pf(da.total.l/grand.l*100):'—'),
              ce('td',{style:{color:'#D97706',fontWeight:700}},da.total.l2r>0?Pf(da.total.l2r):'—'),
              ...(showRT?[ce('td',null,Nf(da.total.dm)),ce('td',null,Nf(da.total.co))]:[]),
              ...colKeys.flatMap(ck=>{
                const ca=da.colAggs[ck]||{l:0,r:0,l2r:0};
                return[
                  ce('td',{key:ck+'l',style:{borderLeft:'2px solid #BFDBFE'}},ca.l>0?Nf(ca.l):'—'),
                  ce('td',{key:ck+'r',style:{color:'#E31837',fontWeight:700}},ca.r>0?Nf(ca.r):'—'),
                  ce('td',{key:ck+'l2r',style:{color:'#D97706'}},ca.l2r>0?Pf(ca.l2r):'—'),
                ];
              })
            );

          ce('tr',{className:'total-row'},
            ce('td',{className:'label',style:{color:'#1A237E',position:'sticky',left:0,zIndex:1}},'∑ Grand Total'),
            ce('td',null,Nf(grand.l)),
            ce('td',{style:{color:'#E31837',fontWeight:700}},Nf(grand.r)),
            ce('td',null,'100.0%'),
            ce('td',{style:{color:'#D97706',fontWeight:700}},grand.l2r>0?Pf(grand.l2r):'—'),
            ...(showRT?[ce('td',null,Nf(grand.dm)),ce('td',null,Nf(grand.co))]:[]),
            ...colKeys.flatMap(ck=>{
              const tL=colGrandL(ck),tR=colGrandR(ck);
              const tL2r=tL>0?tR/tL*100:0;
              return[
                ce('td',{key:ck+'l',style:{borderLeft:'2px solid #BFDBFE'}},tL>0?Nf(tL):'—'),

                ce('td',{key:ck+'l2r',style:{color:'#D97706'}},tL2r>0?Pf(tL2r):'—'),
              ];
            })
          )
        )
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   CITY × SOURCE TAB
   ════════════════════════════════════════════════════════════════════ */
const CitySourceTab = React.memo(function CitySourceTab({ data, filters, months, RT, viewerMode }) {
  const { maps } = data;
  const csm = data.csm || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);
  const allSrcs = useMemo(() => [...new Set(maps.src)], [maps]);
  const srcGroups = useMemo(() => buildSrcGroups(allSrcs), [allSrcs]);
  const [expandedGrps, setExpandedGrps] = useState(new Set());
  const [expandedRows, setExpandedRows] = useState(new Set());
  const onToggleGrp = useCallback(id => setExpandedGrps(prev => {
    const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n;
  }), []);
  const onToggleRow = useCallback(rk => setExpandedRows(prev => {
    const n=new Set(prev); n.has(rk)?n.delete(rk):n.add(rk); return n;
  }), []);

  // csm format: [city_idx, src_idx, lm_idx, L, R_all, R_dms, R_co]
  // Aggregate across all selected months — no per-month breakdown rendered
  const computeAgg = useCallback((monthSet) => {
    const allS  = !filters.sources || filters.sources.size === 0;
    const allC  = !filters.cities  || filters.cities.size  === 0;
    const allSt = !filters.states  || filters.states.size  === 0;
    const bySrc=new Map(), byCity=new Map(), byCitySrc=new Map();
    let gL=0,gR=0;
    for (const row of csm) {
      if (!monthSet.has(maps.lm[row[2]])) continue;
      const city=maps.city[row[0]], src=maps.src[row[1]];
      if (!allC && !filters.cities.has(city)) continue;
      if (!allS && !filters.sources.has(src)) continue;
      if (!allSt && maps.city_state) {
        const stIdx=maps.city_state[row[0]];
        if (!filters.states.has(maps.st[stIdx])) continue;
      }
      const [l,r]=getLR(row);
      gL+=l; gR+=r;
      const cs=bySrc.get(src)||[0,0]; cs[0]+=l; cs[1]+=r; bySrc.set(src,cs);
      const cc=byCity.get(city)||[0,0]; cc[0]+=l; cc[1]+=r; byCity.set(city,cc);
      const k=city+'\x00'+src;
      const ccs=byCitySrc.get(k)||[0,0]; ccs[0]+=l; ccs[1]+=r; byCitySrc.set(k,ccs);
    }
    if (gL===0&&gR===0) return null;
    const grandSrc={};
    for (const [s,v] of bySrc) grandSrc[s]=fin(v[0],v[1]);
    const dimAggs={};
    for (const [c,cv] of byCity) {
      const srcAgg={};
      for (const s of bySrc.keys()) { const v=byCitySrc.get(c+'\x00'+s); srcAgg[s]=v?fin(v[0],v[1]):EMPTY; }
      dimAggs[c]={total:fin(cv[0],cv[1]),src:srcAgg};
    }
    return {grand:fin(gL,gR),grandSrc,dimAggs};
  }, [csm, maps, filters, getLR]);

  const summaryAgg = useMemo(() => computeAgg(new Set(months)), [computeAgg, months]);

  const exportAll = useCallback(() => {
    if (!summaryAgg || summaryAgg.grand.l===0) return;
    const hdr=['City','Total Leads','Total Retail','Contrib%','L2R%',...allSrcs.flatMap(s=>[s+' Leads',s+' Retail',s+' L2R%'])];
    const rows=[hdr];
    for (const [city,da] of Object.entries(summaryAgg.dimAggs)) {
      const row=[city,da.total.l,da.total.r,summaryAgg.grand.l>0?+(da.total.l/summaryAgg.grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const s of allSrcs) { const v=da.src[s]||EMPTY; row.push(v.l,v.r,+v.l2r.toFixed(1)); }
      rows.push(row);
    }
    rows.push(['∑ Grand Total',summaryAgg.grand.l,summaryAgg.grand.r,100,+summaryAgg.grand.l2r.toFixed(1),...allSrcs.flatMap(s=>{const v=summaryAgg.grandSrc[s]||EMPTY;return[v.l,v.r,+v.l2r.toFixed(1)];})]);
    exportXlsx({'City × Source':rows},'TVS_CitySource_All');
  }, [summaryAgg, allSrcs]);

  if (!summaryAgg) return ce('div',{className:'fs-14',style:{textAlign:'center',padding:50,color:'#94A3B8'}},
    'No data matches the current filters.');

  return ce('div', { className:'fade-up' },
    ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce('div', { style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10} },
        ce('div', { className:'section-title', style:{marginBottom:0} }, 'City × Source'),
        ce(ExportBtn, { onClick: exportAll })
      ),
      ce(DimGrid, { agg:summaryAgg, srcGroups, dimLabel:'City', expandedGrps, onToggleGrp, expandedRows, onToggleRow, viewerMode })
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   STATE × MODEL TAB
   ════════════════════════════════════════════════════════════════════ */
const StateModelTab = React.memo(function StateModelTab({ data, filters, months, RT, viewerMode }) {
  const { maps } = data;
  const mxst = data.mxst || [];
  const univ = data.univ || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);

  // mxst format: [mdl_idx, st_idx, lm_idx, L, R_all, R_dms, R_co]  — no src/lt dims
  // univ format: [mi, si, sti, tti, li, L, R_all, R_dms, R_co]      — all 5 dims
  // When source or leadType filter is active, mxst cannot honour it → use univ instead.
  const buildAgg = useCallback((monthSet) => {
    const allSrc = !filters.sources   || filters.sources.size   === 0;
    const allLT  = !filters.leadTypes || filters.leadTypes.size === 0;
    if (!allSrc || !allLT || filters._cityView) {
      // Pre-filter univ by source and/or LT, then aggregate as State × Model cross-tab.
      // univ row positions: mi=0, si=1, sti=2, tti=3, li=4; L/R at row.length-4 / row.length-ri.
      // Summing over tti for fixed (mi,si,sti,li) gives correct total leads — no seenRT dedup
      // needed here because we are aggregating leads (not doing a pmr retail lookup).
      const filtered = univ.filter(row => {
        if (!allSrc && !filters.sources.has(maps.src[row[1]]))    return false;
        if (!allLT  && maps.lt[row[3]] !== LT_NA && !filters.leadTypes.has(maps.lt[row[3]]))  return false;
        return true;
      });
      return buildCrossAgg(
        filtered, maps, 'st', 'mdl', 'lm', 2, 0, 4, monthSet,
        filters.states, filters.models, getLR, data.rt_cols
      );
    }
    return buildCrossAgg(
      mxst, maps, 'st', 'mdl', 'lm', 1, 0, 2, monthSet,
      filters.states, filters.models, getLR, data.rt_cols
    );
  }, [mxst, univ, maps, filters, getLR, data.rt_cols]);

  const summaryAgg = useMemo(() => {
    const a=buildAgg(new Set(months)); return a.grand.l>0?a:null;
  }, [buildAgg, months]);

  const exportAgg = useCallback((agg, label) => {
    if (!agg) return;
    const {colKeys,rowKeys,rowAggs,grand}=agg;
    const hdr=['State','Total Leads','Total Retail','Contrib%','L2R%',...colKeys.flatMap(ck=>[ck+' Leads',ck+' Retail',ck+' L2R%'])];
    const rows=[hdr];
    for (const rk of rowKeys) {
      const da=rowAggs[rk];
      const row=[rk,da.total.l,da.total.r,grand.l>0?+(da.total.l/grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const ck of colKeys) { const ca=da.colAggs[ck]||{l:0,r:0,l2r:0}; row.push(ca.l,ca.r,+ca.l2r.toFixed(1)); }
      rows.push(row);
    }
    const gtRow=['∑ Grand Total',grand.l,grand.r,100,+grand.l2r.toFixed(1)];
    for (const ck of colKeys) { let tL=0,tR=0; for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck]||{l:0,r:0};tL+=ca.l;tR+=ca.r;} const tL2r=tL>0?tR/tL*100:0; gtRow.push(tL,tR,+tL2r.toFixed(1)); }
    rows.push(gtRow);
    exportXlsx({[label]:rows},'TVS_StateModel_'+(label==='Summary'?'All':label.replace("'","")));
  }, []);

  return ce('div', { className:'fade-up' },
    summaryAgg && ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #003087'} },
      ce(CrossTabGrid, { agg:summaryAgg, rowLabel:'State', colLabel:'Model', rtCols:data.rt_cols,
        title:'∑ All Months — State × Model Summary',
        onExport:()=>exportAgg(summaryAgg,'Summary') })
    ),
    ce(CityModelTab, { data, filters, months, RT, viewerMode })
  );
});

/* ════════════════════════════════════════════════════════════════════
   CITY × MODEL TAB
   ════════════════════════════════════════════════════════════════════ */
const CityModelTab = React.memo(function CityModelTab({ data, filters, months, RT, viewerMode }) {
  const { maps } = data;
  // cxsm format: [city_idx, src_idx, mdl_idx, lm_idx, L, R_all, R_dms, R_co]
  // cxm  format: [city_idx, mdl_idx, lm_idx, L, R_all, R_dms, R_co]  (legacy, no source dim)
  const cxsm = data.cxsm || [];
  const cxm  = data.cxm  || [];
  const useCxsm = cxsm.length > 0;        // prefer source-aware matrix when available (the legacy cxm is no longer in the payload)
  const haveCx = useCxsm || cxm.length > 0;
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);

  const buildAgg = useCallback((monthSet) => {
    const stFilter = (filters.states && filters.states.size > 0 && maps.city_state)
      ? new Set(
          (maps.city||[]).reduce((acc,city,i) => {
            const stIdx = maps.city_state[i];
            if (filters.states.has(maps.st[stIdx])) acc.push(city);
            return acc;
          }, [])
        )
      : null;
    const cityF = (filters._cityFilter && filters._cityFilter.size) ? filters._cityFilter : filters.cities;   // the resolved view blanks filters.cities
    const cityRowFilter = stFilter
      ? (cityF && cityF.size > 0
          ? new Set([...stFilter].filter(c => cityF.has(c)))
          : stFilter)
      : cityF;

    if (useCxsm) {
      // Apply source filter by pre-filtering rows (src at index 1)
      const srcSet = filters.sources && filters.sources.size > 0 ? filters.sources : null;
      const table = srcSet
        ? cxsm.filter(row => srcSet.has(maps.src[row[1]]))
        : cxsm;
      return buildCrossAgg(
        table, maps, 'city', 'mdl', 'lm', 0, 2, 3, monthSet,
        cityRowFilter, filters.models, getLR, data.rt_cols
      );
    }
    // Fallback: legacy cxm (no source dimension — source filter ignored)
    return buildCrossAgg(
      cxm, maps, 'city', 'mdl', 'lm', 0, 1, 2, monthSet,
      cityRowFilter, filters.models, getLR, data.rt_cols
    );
  }, [cxsm, cxm, useCxsm, maps, filters, getLR, data.rt_cols]);

  const summaryAgg = useMemo(() => {
    if (!haveCx) return null;
    const a=buildAgg(new Set(months)); return a.grand.l>0?a:null;
  }, [buildAgg, months, haveCx]);

  const exportSummary = useCallback(() => {
    if (!summaryAgg) return;
    const {colKeys,rowKeys,rowAggs,grand}=summaryAgg;
    const hdr=['City','Total Leads','Total Retail','Contrib%','L2R%',...colKeys.flatMap(ck=>[ck+' Leads',ck+' Retail',ck+' L2R%'])];
    const rows=[hdr];
    for (const rk of rowKeys) {
      const da=rowAggs[rk];
      const row=[rk,da.total.l,da.total.r,grand.l>0?+(da.total.l/grand.l*100).toFixed(1):0,+da.total.l2r.toFixed(1)];
      for (const ck of colKeys) { const ca=da.colAggs[ck]||{l:0,r:0,l2r:0}; row.push(ca.l,ca.r,+ca.l2r.toFixed(1)); }
      rows.push(row);
    }
    const gtRow=['∑ Grand Total',grand.l,grand.r,100,+grand.l2r.toFixed(1)];
    for (const ck of colKeys) { let tL=0,tR=0; for(const da of Object.values(rowAggs)){const ca=da.colAggs[ck]||{l:0,r:0};tL+=ca.l;tR+=ca.r;} const tL2r=tL>0?tR/tL*100:0; gtRow.push(tL,tR,+tL2r.toFixed(1)); }
    rows.push(gtRow);
    exportXlsx({'City × Model':rows},'TVS_CityModel_All');
  }, [summaryAgg]);

  if (!haveCx) return null;

  if (!summaryAgg) return null;

  return ce('div', { className:'card', style:{padding:'16px 18px',marginBottom:14,borderTop:'3px solid #0057B8'} },
    ce(CrossTabGrid, { agg:summaryAgg, rowLabel:'City', colLabel:'Model', rtCols:data.rt_cols,
      title:'∑ All Months — City × Model Summary', onExport: exportSummary })
  );
});

/* ════════════════════════════════════════════════════════════════════
   GEO & DEALER TAB
   Columns: Dealer | City | State | Leads | City Share | Open Leads |
            Booking | Retail Attribution | Conv % | Lost | Flags
   Status buckets come from dl_sn (city×dealer×month→[open,booking,lost])
   which is built by the pipeline from Status_Name in the Lead Master.
   When dl_sn is absent (payload predates this feature), status columns
   show "—" rather than 0 so the distinction is clear.
   ════════════════════════════════════════════════════════════════════ */
const GeoDealerTab = React.memo(function GeoDealerTab({ data, filters, months, RT, leadsMode }) {
  const { maps } = data;
  const cdm      = data.cdm    || [];
  const u_cdm    = data.u_cdm  || [];
  const cdsm     = data.cdsm   || [];  // city × dealer × src × month (source-filterable)
  const mxdl     = data.mxdl   || [];  // model × dealer × month
  const ltdl     = data.ltdl   || [];  // lead type × dealer × month
  const u_cdsm   = data.u_cdsm || [];
  const dl_sn    = data.dl_sn  || [];
  const getLR    = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);

  const [search,   setSearch]   = useState('');
  const [sortCol,  setSortCol]  = useState('leads');
  const [sortDir,  setSortDir]  = useState(-1);  // -1 = desc

  const hasDealers  = !!(maps.dl && cdm.length > 0);
  const hasCities   = !!(maps.city && maps.city_state);
  const hasStatusAll = dl_sn.length > 0;
  const mdlOn  = !!(filters.models    && filters.models.size    > 0 && mxdl.length > 0);
  const ltOn   = !!(filters.leadTypes && filters.leadTypes.size > 0 && ltdl.length > 0);
  const altOn  = mdlOn || ltOn;
  const hasStatus   = hasStatusAll && !altOn;   // Open / Booking / Lost are not split by model or lead type

  // Pre-build month set for O(1) lookup
  const monthSet = useMemo(() => new Set(months), [months]);

  // ── Aggregate dealer data ──────────────────────────────────────────────────
  const tableRows = useMemo(() => {
    if (!hasDealers || !hasCities) return [];

    const cityStateArr = maps.city_state || [];
    const allM   = monthSet.size === 0;
    const hasCF  = filters.cities  && filters.cities.size  > 0;
    const hasSF  = filters.states  && filters.states.size  > 0;
    const hasSrcF = filters.sources && filters.sources.size > 0;
    const hasMdlF = filters.models    && filters.models.size    > 0 && mxdl.length > 0;
    const hasLtF  = filters.leadTypes && filters.leadTypes.size > 0 && ltdl.length > 0;
    // Model / Lead Type filter: the dealer x model (or x lead type) tables carry no city, so a dealer is placed in
    // the city where it has most leads and the State / City filters are applied to that city.
    const altMat  = hasMdlF ? mxdl : hasLtF ? ltdl : null;
    const altSet  = hasMdlF ? filters.models : filters.leadTypes;
    const altMap  = hasMdlF ? maps.mdl : maps.lt;

    // cdm  row: [cti, dli, li,     L, R, R_dms, R_co]  (7 elements)
    // cdsm row: [cti, dli, si, li, L, R, R_dms, R_co]  (8 elements)
    // When source filter active use cdsm (has src dim); otherwise cdm.
    const leadMat  = hasSrcF ? cdsm   : cdm;
    const retMat   = hasSrcF
      ? (leadsMode === 'update' ? u_cdsm : cdsm)
      : (leadsMode === 'update' ? u_cdm  : cdm);

    // Step 1 — aggregate leads and retails
    const dlMap = new Map(); // dli → { cti, leads, rets, open, booking, lost }
    const cityTot = new Map(); // cti → all leads in that city under the current filters (City Share denominator)

    if (altMat) {
      const homeCt = new Map(), homeL = new Map();
      for (const row of cdm) {
        const l = row[row.length - 4];
        if (l > (homeL.get(row[1]) || 0)) { homeL.set(row[1], l); homeCt.set(row[1], row[0]); }
      }
      const ctyOk = cti => {
        if (hasCF && !filters.cities.has(maps.city[cti])) return false;
        if (hasSF) { const sti = cityStateArr[cti]; if (sti == null || !filters.states.has(maps.st[sti])) return false; }
        return true;
      };
      for (const row of altMat) {
        const dli = row[1];
        if (!altSet.has(altMap[row[0]])) continue;
        if (!allM && !monthSet.has(maps.lm[row[2]])) continue;
        const cti = homeCt.get(dli);
        if (cti == null || !ctyOk(cti)) continue;
        const l = row[row.length - 4];
        const [, r] = getLR(row);
        if (!dlMap.has(dli)) dlMap.set(dli, { cti, leads:0, rets:0, open:0, booking:0, lost:0 });
        const rec = dlMap.get(dli);
        rec.leads += l; rec.rets += r;
      }
      const cityLeads2 = new Map();
      const cxRows = (data.cxm || []).length ? data.cxm : (data.cxsm || []), cxMo = (data.cxm || []).length ? 1 : 2;   // cxsm: [city, src, model, month, ...]
      if (hasMdlF && cxRows.length) {          // exact: all leads of the selected models in each city
        for (const row of cxRows) {
          if (!altSet.has(maps.mdl[row[cxMo]])) continue;
          if (!allM && !monthSet.has(maps.lm[row[cxMo + 1]])) continue;
          cityLeads2.set(row[0], (cityLeads2.get(row[0]) || 0) + row[row.length - 4]);
        }
      } else for (const [, rec] of dlMap) cityLeads2.set(rec.cti, (cityLeads2.get(rec.cti) || 0) + rec.leads);
      const out2 = [];
      for (const [dli, rec] of dlMap) {
        if (rec.leads === 0 && rec.rets === 0) continue;
        const sti = hasCities ? (cityStateArr[rec.cti] ?? null) : null;
        out2.push({ dealer: maps.dl[dli] || '—', city: hasCities ? (maps.city[rec.cti] || '—') : '—',
                    state: sti != null ? (maps.st[sti] || '—') : '—', leads: rec.leads, rets: rec.rets,
                    cityShare: Math.min(100, rec.leads / (cityLeads2.get(rec.cti) || 1) * 100),
                    convPct: rec.leads > 0 ? rec.rets / rec.leads * 100 : 0, open: 0, booking: 0, lost: 0 });
      }
      return out2;
    }

    function applyFilters(cti, lmi) {
      const m = maps.lm[lmi];
      if (!allM && !monthSet.has(m)) return false;
      if (hasCF) {
        const city = maps.city[cti];
        if (!filters.cities.has(city)) return false;
      }
      if (hasSF) {
        const sti = cityStateArr[cti];
        if (sti == null || !filters.states.has(maps.st[sti])) return false;
      }
      return true;
    }

    // Count leads (On Create — leads don't change with leadsMode)
    for (const row of leadMat) {
      // cdsm: [cti, dli, si, li, ...]; cdm: [cti, dli, li, ...]
      const cti = row[0], dli = row[1];
      const si  = hasSrcF ? row[2] : -1;
      const lmi = hasSrcF ? row[3] : row[2];
      if (hasSrcF && !filters.sources.has(maps.src[si])) continue;
      if (!applyFilters(cti, lmi)) continue;
      const l = row[row.length - 4];
      cityTot.set(cti, (cityTot.get(cti) || 0) + l);
      if (!dlMap.has(dli)) dlMap.set(dli, { cti, leads:0, rets:0, open:0, booking:0, lost:0, byCity:new Map() });
      const rec = dlMap.get(dli);
      rec.byCity.set(cti, (rec.byCity.get(cti) || 0) + l);
      rec.leads += l;
      if (l > (rec._maxL || 0)) { rec.cti = cti; rec._maxL = l; }
    }

    // Count retails from retMat (honours leadsMode + source filter)
    for (const row of retMat) {
      const cti = row[0], dli = row[1];
      const si  = hasSrcF ? row[2] : -1;
      const lmi = hasSrcF ? row[3] : row[2];
      if (hasSrcF && !filters.sources.has(maps.src[si])) continue;
      if (!applyFilters(cti, lmi)) continue;
      if (!dlMap.has(dli)) continue;
      const [, r] = getLR(row);
      dlMap.get(dli).rets += r;
    }

    // Step 2 — aggregate status (dl_sn has no source dim — always all-source)
    if (hasStatus) {
      for (const row of dl_sn) {
        const cti = row[0], dli = row[1], lmi = row[2];
        if (!applyFilters(cti, lmi)) continue;
        if (!dlMap.has(dli)) continue;
        const rec = dlMap.get(dli);
        rec.open    += row[3];
        rec.booking += row[4];
        rec.lost    += row[5];
      }
    }

    // Step 3 — city totals for City Share denominator
    const cityLeads = cityTot;

    // Step 4 — build output rows
    const out = [];
    for (const [dli, rec] of dlMap) {
      if (rec.leads === 0 && rec.rets === 0) continue;
      const dealer    = maps.dl[dli] || '—';
      const cti       = rec.cti;
      const city      = hasCities ? (maps.city[cti] || '—') : '—';
      const sti       = hasCities ? (cityStateArr[cti] ?? null) : null;
      const state     = sti != null ? (maps.st[sti] || '—') : '—';
      const cityTotal = cityLeads.get(cti) || 1;
      const cityShare = Math.min(100, (rec.byCity.get(cti) || 0) / cityTotal * 100);   // dealer's leads in this city / all leads in this city
      const convPct   = rec.leads > 0 ? rec.rets / rec.leads * 100 : 0;
      out.push({ dealer, city, state, leads: rec.leads, rets: rec.rets,
                 cityShare, convPct, open: rec.open, booking: rec.booking, lost: rec.lost });
    }
    return out;
  }, [cdm, u_cdm, cdsm, u_cdsm, mxdl, ltdl, dl_sn, maps, monthSet, filters, getLR, leadsMode, hasDealers, hasCities, hasStatus]);

  // ── Filter (search) + sort ─────────────────────────────────────────────────
  const displayRows = useMemo(() => {
    let rows = tableRows;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      rows = rows.filter(r =>
        r.dealer.toLowerCase().includes(q) ||
        r.city.toLowerCase().includes(q) ||
        r.state.toLowerCase().includes(q)
      );
    }
    const key = sortCol;
    const d   = sortDir;
    return [...rows].sort((a, b) => {
      const av = a[key], bv = b[key];
      if (typeof av === 'number' && typeof bv === 'number') return d * (bv - av);
      return d * String(av).localeCompare(String(bv));
    });
  }, [tableRows, search, sortCol, sortDir]);

  // ── City Share badge ───────────────────────────────────────────────────────
  function cityShareBadge(pct) {
    const bg = pct >= 80 ? '#FEE2E2' : pct >= 40 ? '#FEF3C7' : '#F0FDF4';
    const cl = pct >= 80 ? '#B91C1C' : pct >= 40 ? '#92400E' : '#166534';
    return ce('span', {
      style:{ display:'inline-block', padding:'2px 8px', borderRadius:20, fontSize:'calc(10px * var(--tvs-font-scale))',
              fontWeight:700, fontFamily:'DM Mono,monospace', background:bg, color:cl, whiteSpace:'nowrap' }
    }, pct.toFixed(1) + '%');
  }

  // ── Column sort helper ─────────────────────────────────────────────────────
  function thSort(col, label) {
    const active = sortCol === col;
    const arrow  = active ? (sortDir === -1 ? ' ↓' : ' ↑') : ' ↕';
    return ce('th', {
      className: 'grp-toggle left',
      style: { cursor:'pointer', userSelect:'none', background: active ? '#C5CAE9' : '#E8EAF6',
               color: active ? '#0D47A1' : '#1A237E' },
      onClick: () => {
        if (active) setSortDir(d => -d);
        else { setSortCol(col); setSortDir(-1); }
      }
    }, label + arrow);
  }

  function thNum(col, label) {
    const active = sortCol === col;
    const arrow  = active ? (sortDir === -1 ? ' ↓' : ' ↑') : ' ↕';
    return ce('th', {
      className: 'grp-toggle',
      style: { cursor:'pointer', userSelect:'none', background: active ? '#C5CAE9' : '#E8EAF6',
               color: active ? '#0D47A1' : '#1A237E' },
      onClick: () => {
        if (active) setSortDir(d => -d);
        else { setSortCol(col); setSortDir(-1); }
      }
    }, label + arrow);
  }

  // ── Empty / loading states ─────────────────────────────────────────────────
  if (!hasDealers) return ce('div', {
    className:'fs-14', style:{textAlign:'center',padding:60,color:'#94A3B8'}
  },
    ce('div', { style:{fontSize:32,marginBottom:12} }, '🏪'),
    'Dealer data will be available after the next pipeline run.'
  );

  const noData = displayRows.length === 0;

  return ce('div', { className:'fade-up' },

    // ── Header bar ────────────────────────────────────────────────────────────
    ce('div', { className:'card', style:{padding:'14px 18px',marginBottom:12,borderTop:'3px solid #E31837',
        display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10} },
      ce('div', { style:{display:'flex',alignItems:'center',gap:10} },
        ce('div', { className:'fs-14', style:{fontWeight:800,color:'#0f172a',letterSpacing:'-.02em'} },
          'Dealer Performance'),
        !hasStatus && ce('span', {
          style:{fontSize:'calc(10px * var(--tvs-font-scale))',color:'#92400E',background:'#FEF3C7',
                 padding:'2px 10px',borderRadius:20,fontWeight:600}
        }, 'Status data available after next pipeline run')
      ),
      ce('div', { style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'} },
        // Search box
        ce('input', {
          type:'text', placeholder:'Search dealer / city / state…',
          value: search, onChange: e => setSearch(e.target.value),
          style:{ padding:'5px 12px', border:'1px solid #CBD5E1', borderRadius:20,
                  fontSize:'calc(11px * var(--tvs-font-scale))', fontFamily:'inherit',
                  outline:'none', width:220, background:'#fff', color:'#0f172a' }
        }),
        ce('div', { className:'fs-10', style:{color:'#64748B',fontFamily:'DM Mono,monospace'} },
          Nf(displayRows.length) + ' dealer' + (displayRows.length !== 1 ? 's' : ''))
      )
    ),

    altOn && ce('div', {
      style:{ padding:'7px 14px', background:'#EFF6FF', border:'1px solid #93C5FD', borderRadius:8,
              fontSize:12, color:'#1E3A8A', marginBottom:12 }
    }, '\u24D8  ' + (mdlOn ? 'Model' : 'Lead Type') + ' filter applied to Leads and Retails. Each dealer is placed in its main city for the State / City filters; Open / Booking / Lost are not split by '
        + (mdlOn ? 'model' : 'lead type') + ' and Source' + (mdlOn && ltOn ? ' / Lead Type' : '') + ' is ignored here.'),

    // ── Summary KPIs ──────────────────────────────────────────────────────────
    (() => {
      const tot = displayRows.reduce((a, r) => {
        a.leads += r.leads; a.rets += r.rets;
        a.open += r.open; a.booking += r.booking; a.lost += r.lost;
        return a;
      }, { leads:0, rets:0, open:0, booking:0, lost:0 });
      const convPct = tot.leads > 0 ? tot.rets / tot.leads * 100 : 0;
      const kpis = [
        { label:'Dealers',   value: Nf(displayRows.length) },
        { label:'Leads',     value: Nf(tot.leads) },
        { label:'Retails',   value: Nf(tot.rets),    accent:'#003087' },
        { label:'Conv %',    value: convPct > 0 ? convPct.toFixed(1)+'%' : '—', accent: convPct >= 15 ? '#16A34A' : convPct >= 8 ? '#D97706' : '#DC2626' },
        ...(hasStatus ? [
          { label:'Open Leads', value: Nf(tot.open),    accent:'#003087' },
          { label:'Booking',    value: Nf(tot.booking), accent:'#7C3AED' },
          { label:'Lost',       value: Nf(tot.lost),    accent:'#DC2626' },
        ] : []),
      ];
      return ce(SummaryBar, { kpis });
    })(),

    // ── Table ────────────────────────────────────────────────────────────────
    ce('div', { className:'card', style:{padding:0,overflow:'hidden'} },
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null,
            ce('tr', null,
              thSort('dealer', 'Dealer'),
              thSort('city',   'City'),
              thSort('state',  'State'),
              thNum('leads',   'Leads'),
              thNum('cityShare','City Share'),
              thNum('open',    'Open Leads'),
              thNum('booking', 'Booking'),
              thNum('rets',    'Retail Attribution'),
              thNum('convPct', 'Conv %'),
              thNum('lost',    'Lost'),
              ce('th', null, 'Flags'),
            )
          ),
          ce('tbody', null,
            noData
              ? ce('tr', null, ce('td', { colSpan:11, style:{textAlign:'center',padding:40,color:'#94A3B8'} },
                  search ? 'No dealers match "' + search + '".' : 'No data for the selected filters.'))
              : displayRows.map((r, idx) =>
                  ce('tr', { key: r.dealer + '|' + r.city, className:'dealer-row' },

                    // Dealer
                    ce('td', { className:'label', style:{minWidth:180,maxWidth:260} }, r.dealer),

                    // City
                    ce('td', { className:'label', style:{color:'#003087',fontFamily:"'Inter',system-ui,sans-serif",
                        fontWeight:500,fontSize:'calc(11px * var(--tvs-font-scale))',background:'#FAFAFA'} },
                      r.city),

                    // State
                    ce('td', { style:{textAlign:'left',fontFamily:"'Inter',system-ui,sans-serif",
                        fontSize:'calc(11px * var(--tvs-font-scale))',color:'#475569'} },
                      r.state),

                    // Leads
                    ce('td', { style:{fontWeight:600} }, Nf(r.leads)),

                    // City Share
                    ce('td', null, cityShareBadge(r.cityShare)),

                    // Open Leads
                    ce('td', { style:{color: hasStatus ? '#1D4ED8' : '#94A3B8', fontWeight: hasStatus ? 600 : 400} },
                      hasStatus ? Nf(r.open) : '—'),

                    // Booking
                    ce('td', { style:{color: hasStatus ? '#7C3AED' : '#94A3B8', fontWeight: hasStatus ? 600 : 400} },
                      hasStatus ? Nf(r.booking) : '—'),

                    // Retail Attribution
                    ce('td', { style:{color:'#003087',fontWeight:600} }, Nf(r.rets)),

                    // Conv %
                    ce('td', null, l2rBadge(r.convPct)),

                    // Lost
                    ce('td', { style:{color: hasStatus ? '#B91C1C' : '#94A3B8', fontWeight: hasStatus ? 600 : 400} },
                      hasStatus ? Nf(r.lost) : '—'),

                    // Flags
                    ce('td', { className:'badge-gray' }, '—'),
                  )
                )
          )
        )
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   STATUS FUNNEL TAB
   Granular LMS Status_Name breakdown for CPS-triggered leads.
   Sourced from data.snf: [status_idx, src_idx, city_idx, model_idx, lead_month_idx, count].
   Only populated for months whose live GSheet carries a Status_Name column —
   in practice the current + previous ("T-1") month, since those are the only
   sheets MIS Automation writes daily LMS status updates into. Older/frozen
   months and historical hist_cache leads have no Status_Name and are absent
   here by construction, so this tab is naturally scoped to "current + T-1".
   ════════════════════════════════════════════════════════════════════ */
const StatusFunnelTab = React.memo(function StatusFunnelTab({ data, filters, months }) {
  const { maps } = data;
  const snf     = data.snf || [];
  const hasSnf  = !!(maps.sn && maps.sn.length > 0);

  const [search,  setSearch]  = useState('');
  const [sortCol, setSortCol] = useState('count');
  const [sortDir, setSortDir] = useState(-1);  // -1 = desc

  const monthSet = useMemo(() => new Set(months), [months]);

  // ── Aggregate: Status_Name → count, honouring the standard global filters ──
  const tableRows = useMemo(() => {
    if (!hasSnf) return [];
    const allM    = monthSet.size === 0;
    const hasSrcF = filters.sources && filters.sources.size > 0;
    const hasCF   = filters.cities  && filters.cities.size  > 0;
    const hasMdlF = filters.models  && filters.models.size  > 0;
    const hasStF  = filters.states  && filters.states.size  > 0 && !!maps.city_state;
    const hasLtF  = filters.leadTypes && filters.leadTypes.size > 0 && data.snf_v === 2;   // older payloads carry no lead type

    const acc = new Map(); // sni → count
    for (const row of snf) {
      const [sni, si, cti, mi, li] = row;
      const count = row[row.length - 1];
      const mon = maps.lm[li];
      if (!allM && !monthSet.has(mon)) continue;
      if (hasSrcF && !filters.sources.has(maps.src[si])) continue;
      if (hasCF   && !filters.cities.has(maps.city[cti])) continue;
      if (hasMdlF && !filters.models.has(maps.mdl[mi])) continue;
      if (hasStF && !filters.states.has(maps.st[maps.city_state[cti]])) continue;
      if (hasLtF && !filters.leadTypes.has(maps.lt[row[5]])) continue;
      acc.set(sni, (acc.get(sni) || 0) + count);
    }

    const total = [...acc.values()].reduce((a, v) => a + v, 0) || 1;
    const out = [];
    for (const [sni, count] of acc) {
      out.push({ status: maps.sn[sni] || '—', count, pct: count / total * 100 });
    }
    return out;
  }, [snf, maps, monthSet, filters, hasSnf]);

  const displayRows = useMemo(() => {
    let rows = tableRows;
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      rows = rows.filter(r => r.status.toLowerCase().includes(q));
    }
    const key = sortCol, d = sortDir;
    return [...rows].sort((a, b) => {
      const av = a[key], bv = b[key];
      if (typeof av === 'number' && typeof bv === 'number') return d * (bv - av);
      return d * String(av).localeCompare(String(bv));
    });
  }, [tableRows, search, sortCol, sortDir]);

  function thSort(col, label) {
    const active = sortCol === col;
    const arrow  = active ? (sortDir === -1 ? ' ↓' : ' ↑') : ' ↕';
    return ce('th', {
      className: col === 'status' ? 'grp-toggle left' : 'grp-toggle',
      style: { cursor:'pointer', userSelect:'none', background: active ? '#C5CAE9' : '#E8EAF6',
               color: active ? '#0D47A1' : '#1A237E' },
      onClick: () => {
        if (active) setSortDir(d => -d);
        else { setSortCol(col); setSortDir(-1); }
      }
    }, label + arrow);
  }

  if (!hasSnf) return ce('div', {
    className:'fs-14', style:{textAlign:'center',padding:60,color:'#94A3B8'}
  },
    ce('div', { style:{fontSize:32,marginBottom:12} }, '🔀'),
    'Status funnel data will be available after the next pipeline run.'
  );

  const noData = displayRows.length === 0;
  const totalLeads = displayRows.reduce((a, r) => a + r.count, 0);

  return ce('div', { className:'fade-up' },

    // ── Header bar ────────────────────────────────────────────────────────
    ce('div', { className:'card', style:{padding:'14px 18px',marginBottom:12,borderTop:'3px solid #E31837',
        display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10} },
      ce('div', { className:'fs-14', style:{fontWeight:800,color:'#0f172a',letterSpacing:'-.02em'} },
        'LMS Status Funnel'),
      ce('div', { style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'} },
        ce('input', {
          type:'text', placeholder:'Search status…',
          value: search, onChange: e => setSearch(e.target.value),
          style:{ padding:'5px 12px', border:'1px solid #CBD5E1', borderRadius:20,
                  fontSize:'calc(11px * var(--tvs-font-scale))', fontFamily:'inherit',
                  outline:'none', width:200, background:'#fff', color:'#0f172a' }
        }),
        ce('div', { className:'fs-10', style:{color:'#64748B',fontFamily:'DM Mono,monospace'} },
          Nf(displayRows.length) + ' status' + (displayRows.length !== 1 ? 'es' : ''))
      )
    ),

    // ── Summary KPIs ──────────────────────────────────────────────────────
    ce(SummaryBar, { kpis: [
      { label:'Statuses',     value: Nf(displayRows.length) },
      { label:'Leads (with an LMS status)', value: Nf(totalLeads), accent:'#003087' },
    ] }),

    // ── Table ───────────────────────────────────────────────────────────
    ce('div', { className:'card', style:{padding:0,overflow:'hidden'} },
      ce('div', { className:'scroll-x' },
        ce('table', null,
          ce('thead', null,
            ce('tr', null,
              thSort('status', 'Status'),
              thSort('count',  'Leads'),
              thSort('pct',    '% of Total'),
            )
          ),
          ce('tbody', null,
            noData
              ? ce('tr', null, ce('td', { colSpan:3, style:{textAlign:'center',padding:40,color:'#94A3B8'} },
                  search ? 'No statuses match "' + search + '".' : 'No data for the selected filters.'))
              : displayRows.map(r =>
                  ce('tr', { key: r.status },
                    ce('td', { className:'label', style:{minWidth:220} }, r.status),
                    ce('td', { style:{fontWeight:600} }, Nf(r.count)),
                    ce('td', null,
                      ce('div', { style:{display:'flex',alignItems:'center',gap:8} },
                        ce('div', { style:{flex:1,height:6,borderRadius:3,background:'#E2E8F0',overflow:'hidden',maxWidth:120} },
                          ce('div', { style:{width:r.pct.toFixed(1)+'%',height:'100%',background:'#003087'} })
                        ),
                        ce('span', { className:'fs-10', style:{color:'#64748B',fontFamily:'DM Mono,monospace'} }, r.pct.toFixed(1)+'%')
                      )
                    ),
                  )
                )
          )
        )
      )
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   MODEL PERFORMANCE TAB
   Month-on-month Leads × Retail × L2R% for every model.
   Columns: months sorted latest → oldest; Rows: models by total leads.
   Accessible to all roles including Viewer.
   ════════════════════════════════════════════════════════════════════ */
const ModelPerfTab = React.memo(function ModelPerfTab({ data, filters, months, RT, pmMaps }) {
  const { maps } = data;
  const mm    = data.mm   || [];
  const univ  = data.univ || [];
  const getLR = useMemo(() => makeLR(data.rt_cols, RT), [data.rt_cols, RT]);

  // ── Aggregation: model → month → [L, R] ───────────────────────────
  // Canonical two-path approach identical to ModelSourceTab:
  //   1. univF (model/state/LT filter active) → iterate univ [mi,si,sti,tti,li,…]
  //   2. otherwise                            → iterate mm   [mi,si,li,…]
  // City filters are intentionally NOT applied here so this tab always
  // agrees with Model × Source for every filter combination.
  const tableAgg = useMemo(() => {
    const univF   = makeUnivFilter(filters);
    const allSrcs = !filters.sources || filters.sources.size === 0;
    const allMdl  = !filters.models  || filters.models.size  === 0;
    const monthSet = new Set(months);

    const acc = new Map(); // mdl → Map<month, [L, R]>
    function bump(mdl, mon, l, r) {
      if (!acc.has(mdl)) acc.set(mdl, new Map());
      const mmap = acc.get(mdl);
      const cur  = mmap.get(mon) || [0, 0];
      cur[0] += l; cur[1] += r; mmap.set(mon, cur);
    }

    const pmRI = RT === 'dms' ? 1 : RT === 'co' ? 2 : 0;
    if (univF) {
      // model/state/LT filter active → use univ [mi, si, sti, tti, li, ...]
      const seenRT = new Set();
      for (const row of univ) {
        const mon = maps.lm[row[4]];
        if (!monthSet.has(mon)) continue;
        if (!allSrcs && !filters.sources.has(maps.src[row[1]])) continue;
        if (!univF(row, maps)) continue;
        const [l, r_raw] = getLR(row);
        let r = 0;
        if (pmMaps) {
          const rtKey = row[0]+'|'+row[1]+'|'+row[4];
          if (!seenRT.has(rtKey)) { seenRT.add(rtKey); const v = pmMaps.miSiLi.get(rtKey); r = v ? v[pmRI] : 0; }
        } else { r = r_raw; }
        bump(maps.mdl[row[0]], mon, l, r);
      }
    } else {
      // no model/state/LT filter → use mm [mi, si, li, ...]
      for (const row of mm) {
        const mon = maps.lm[row[2]];
        if (!monthSet.has(mon)) continue;
        const mdl = maps.mdl[row[0]];
        if (!allMdl && !filters.models.has(mdl)) continue;
        if (!allSrcs && !filters.sources.has(maps.src[row[1]])) continue;
        const [l, r_raw] = getLR(row);
        const pmOv = pmMaps && pmMaps.miSiLi.get(row[0]+'|'+row[1]+'|'+row[2]);
        const r = pmOv ? pmOv[pmRI] : (pmMaps ? 0 : r_raw);
        bump(mdl, mon, l, r);
      }
    }
    return acc;
  }, [mm, univ, maps, filters, months, getLR, pmMaps, RT]);

  // Sort models by total leads descending
  const modelRows = useMemo(() => {
    const rows = [];
    for (const [mdl, mmap] of tableAgg) {
      let tL = 0;
      for (const [, v] of mmap) tL += v[0];
      rows.push({ mdl, mmap, tL });
    }
    rows.sort((a, b) => b.tL - a.tL);
    return rows;
  }, [tableAgg]);

  // Grand totals per month (sum across all models)
  const grandByMonth = useMemo(() => {
    const g = new Map();
    for (const { mmap } of modelRows) {
      for (const [mon, v] of mmap) {
        const cur = g.get(mon) || [0, 0];
        cur[0] += v[0]; cur[1] += v[1]; g.set(mon, cur);
      }
    }
    return g;
  }, [modelRows]);

  if (months.length === 0 || months[0] === '\x00')
    return ce('div', { className:'fs-13', style:{ textAlign:'center', padding:40, color:'#94A3B8' } }, 'No months to display.');
  if (modelRows.length === 0)
    return ce('div', { className:'fs-13', style:{ textAlign:'center', padding:40, color:'#94A3B8' } }, 'No data for the selected filters.');

  // ── L2R% badge cell ──────────────────────────────────────────────
  function cellL2R(l, r) {
    if (!l || l === 0) return ce('span', { className:'badge-gray' }, '—');
    const pct = r / l * 100;
    const cls = pct >= 15 ? 'badge-green' : pct >= 8 ? 'badge-amber' : 'badge-red';
    return ce('span', { className:'badge ' + cls }, pct.toFixed(1) + '%');
  }

  // ── Overall summary numbers ───────────────────────────────────────
  let totalL = 0, totalR = 0;
  for (const [, v] of grandByMonth) { totalL += v[0]; totalR += v[1]; }

  // ── Table header rows ─────────────────────────────────────────────
  // Row 1: Model (rowSpan=2) + month group headers (colSpan=3 each)
  const headerRow1 = [
    ce('th', {
      key: 'mdl', rowSpan: 2, className: 'left',
      style: { minWidth: 150, zIndex: 3, background: '#E8EAF6', color: '#1A237E',
               position: 'sticky', left: 0, verticalAlign: 'middle', borderRight: '2px solid #9FA8DA' }
    }, 'Model'),
    ...months.map(m =>
      ce('th', {
        key: m, colSpan: 3,
        style: { background: '#E8EAF6', color: '#1A237E', textAlign: 'center',
                 borderLeft: '2px solid #9FA8DA' }
      }, m.toUpperCase())
    )
  ];
  // Row 2: sub-column headers (Leads / Retail / L2R% per month)
  const headerRow2 = months.flatMap(m => [
    ce('th', { key: m + 'l',   className: 'sub', style: { borderLeft: '2px solid #9FA8DA' } }, 'Leads'),
    ce('th', { key: m + 'r',   className: 'sub' }, 'Retail'),
    ce('th', { key: m + 'l2r', className: 'sub' }, 'L2R%'),
  ]);

  // ── Per-model cells for a given month-map ────────────────────────
  function monthCells(mmap) {
    return months.flatMap(m => {
      const [l, r] = mmap.get(m) || [0, 0];
      return [
        ce('td', { key: m + 'l', style: { borderLeft: '2px solid #E2E8F0' } }, l > 0 ? Nf(l) : '—'),
        ce('td', { key: m + 'r', style: { color: '#E31837', fontWeight: 700  } }, r > 0 ? Nf(r) : '—'),
        ce('td', { key: m + 'l2r' }, cellL2R(l, r)),
      ];
    });
  }

  // ── Grand Total cells ────────────────────────────────────────────
  const grandCells = months.flatMap(m => {
    const [l, r] = grandByMonth.get(m) || [0, 0];
    return [

﻿/* ════════════════════════════════════════════════════════════════════
   DAY ON DAY TAB  — leads per lead-creation day; retails stacked DMS / VOC (Call Out)
   On Create : retails of the leads created that day (data.dd  = [day, mdl, src, lt, L, R, R_dms, R_co])
   On Update : retails counted on the day they were ATTRIBUTED (data.ddu = [day, mdl, src, lt, R, R_dms, R_co]),
               leads still on their creation day — the same On Update logic as the rest of the dashboard.
   day = YYYYMMDD ; YYYYMM00 = "no day recorded" for that month (kept so month totals always reconcile).
   State / City / Purchased-model filters do not exist in these tables.
   ════════════════════════════════════════════════════════════════════ */
let _dailyPromise = null;
function loadDailyDetail() {
  if (!_dailyPromise) {
    _dailyPromise = fetch('./data/tvs_daily.json.gz', { cache: 'no-store' }).then(async resp => {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.pipeThrough(new DecompressionStream('gzip')).getReader();
      const chunks = [];
      while (true) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); }
      return JSON.parse(await new Blob(chunks).text());
    }).catch(() => { _dailyPromise = null; return null; });
  }
  return _dailyPromise;
}

// "▲ 12.3%" / "▼ 4.0 pp" for the month-to-date comparison (null when it cannot be computed).
// Per-index filter masks for the daily detail file (every filter; Purchased Model is returned separately, it only affects retails).
function dailyPreds(dx, filters, maps) {
  const has = s => !!(s && s.size);
  let pmSel = null;
  if (has(filters.purchasedModels)) {
    const selNames = new Set([...resolvePmIdx(filters.purchasedModels, maps)].map(i => maps.mdl[i]));
    pmSel = new Set();
    dx.maps.mdl.forEach((name, i) => { if (selNames.has(name)) pmSel.add(i); });
  }
  return {
    pmSel,
    okM:  dx.maps.mdl.map(n => !has(filters.models) || filters.models.has(n)),
    okS:  dx.maps.src.map(n => !has(filters.sources) || filters.sources.has(n)),
    okT:  dx.maps.lt.map(n => !has(filters.leadTypes) || filters.leadTypes.has(n)),
    okSt: dx.maps.st.map(n => !has(filters.states) || filters.states.has(n)),
    okC:  dx.cityName.map(n => !has(filters.cities) || filters.cities.has(n)),
  };
}

function fmtDelta(v, unit) {

  const a = Math.abs(v).toFixed(1);
  return { up: v >= 0, txt: (v >= 0 ? '▲ +' : '▼ −') + a + unit };
}

const DailyTab = React.memo(function DailyTab({ data, filters, months, RT, leadsMode }) {
  const { maps } = data;
  const dd  = data.dd  || [];
  const ddu = data.ddu || [];
  const upd = leadsMode === 'update';
  const hasSt = data.dd_v === 2;          // rows carry a state column after lead type (older payloads do not)
  const o = hasSt ? 1 : 0;
  const chartRef = useRef(); const chartInst = useRef();
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Month choices follow the global Month filter (newest first); the picker below moves within them.
  const opts = useMemo(() => (months || []).filter(m => m && m !== '\x00'), [months]);
  const [sel, setSel] = useState(opts[0] || '');

  const [rangeFrom, setRangeFrom] = useState('');
  const [rangeTo, setRangeTo] = useState('');
  const rg = useMemo(() => { const f = rangeFrom || rangeTo, t = rangeTo || rangeFrom; if (!f) return null; return f <= t ? [f, t] : [t, f]; }, [rangeFrom, rangeTo]);

  const inPeriod = d => d >= rgInt[0] && d <= rgInt[1];

  const dayLbl = x => (rg ? x.d + ' ' + MONTHS[x.mo - 1] + (rg[0].slice(0, 4) !== rg[1].slice(0, 4) ? ' ' + String(x.yr).slice(2) : '') : String(x.d));
  const pickMonth = m => { setRangeFrom(''); setRangeTo(''); setSel(m); };
  const bounds = useMemo(() => {
    let lo = null, hi = null;
    opts.forEach(m => { const x = /([A-Za-z]+)'(\d+)/.exec(m); if (!x) return; const a = (2000 + +x[2]) * 100 + MONTHS.indexOf(x[1]) + 1; if (lo === null || a < lo) lo = a; if (hi === null || a > hi) hi = a; });
    if (lo === null) return ['', ''];

  const view = useMemo(() => {

    if (mon < 1) return null;

    const pYear = mon === 1 ? year - 1 : year, pMon = mon === 1 ? 12 : mon - 1;

    const allLT   = !filters.leadTypes || filters.leadTypes.size === 0;
    const allSt   = !filters.states    || filters.states.size    === 0;
    const allCity = !filters.cities    || filters.cities.size    === 0;

    const P = dx ? dailyPreds(dx, filters, maps) : null;

      let uL = 0, uRd = 0, uRc = 0;                       // "no day recorded" parts of the month
      if (dx && dx.months.includes(cym)) {
        const A = dx.L, B = dx.R, K = upd ? B.ud : B.cd;
        for (let i = 0; i < A.n.length; i++) {          // leads: every filter except Purchased Model
          if (Math.floor(A.d[i] / 100) !== cym) continue;
          if (!(okM[A.mi[i]] && okS[A.si[i]] && okT[A.lt[i]] && okSt[A.st[i]] && okC[A.ci[i]])) continue;
          const d = A.d[i] % 100;
          if (d === 0 || d > cdim) uL += A.n[i]; else L[d - 1] += A.n[i];
        }
        for (let i = 0; i < B.n.length; i++) {
          if (Math.floor(K[i] / 100) !== cym || B.rt[i] === 2) continue;
          if (!((pmSel || okM[B.mi[i]]) && okS[B.si[i]] && okT[B.lt[i]] && okSt[B.st[i]] && okC[B.ci[i]])) continue;   // a Purchased Model selection replaces the enquired-Model filter for retails
          if (pmSel && !pmSel.has(B.pm[i])) continue;
          const d = K[i] % 100, dms = B.rt[i] === 0;
          if (d === 0 || d > cdim) { if (dms) uRd += B.n[i]; else uRc += B.n[i]; }
          else if (dms) Rd[d - 1] += B.n[i]; else Rc[d - 1] += B.n[i];
        }
        return { L, Rd, Rc, uL, uRd, uRc, exact: true };
      }
      if (!dd.length) return null;
      const keep = row => Math.floor(row[0] / 100) === cym
        && (allMdl || filters.models.has(maps.mdl[row[1]]))
        && (allSrc || filters.sources.has(maps.src[row[2]]))
        && (allLT  || filters.leadTypes.has(maps.lt[row[3]]))
        && (!hasSt || allSt || filters.states.has(maps.st[row[4]]));

        L[d - 1] += row[4 + o];
        if (!upd) { Rd[d - 1] += row[6 + o]; Rc[d - 1] += row[7 + o]; }
      }
      if (upd) {
        for (const row of ddu) {
          if (!keep(row)) continue;
          const d = row[0] % 100;
          if (d === 0 || d > cdim) { uRd += row[5 + o]; uRc += row[6 + o]; continue; }
          Rd[d - 1] += row[5 + o]; Rc[d - 1] += row[6 + o];

          if (c) {
            if (!c.exact) exactAll = false;

              const iso = y + '-' + String(m).padStart(2, '0') + '-' + String(i + 1).padStart(2, '0');
              if (iso < rg[0] || iso > rg[1]) continue;
              const rd0 = sD ? c.Rd[i] : 0, rc0 = sC ? c.Rc[i] : 0;
              days0.push({ d: i + 1, yr: y, mo: m, wd: WD[new Date(y, m - 1, i + 1).getDay()], l: c.L[i], rd: rd0, rc: rc0, r: rd0 + rc0,
                           l2r: c.L[i] > 0 ? (rd0 + rc0) / c.L[i] * 100 : 0 });

      days0.forEach((x, i) => { if (x.l > 0 || x.rd > 0 || x.rc > 0) lastI = i; if (x.l > 0) lastLI = i; });
      const sh = days0.slice(0, lastI + 1);
      const gL = sh.reduce((a, x) => a + x.l, 0), gRd = sh.reduce((a, x) => a + x.rd, 0), gRc = sh.reduce((a, x) => a + x.rc, 0);
      return { year: +rg[0].slice(0, 4), mon: +rg[0].slice(5, 7), dim: days0.length, days: days0, shown: sh, last: sh.length,
               uL: 0, uR: 0, nRd: 0, nRc: 0, dL: gL, dR: gRd + gRc, tL: gL, tR: gRd + gRc, tRd: gRd, tRc: gRc,
               peak: sh.length ? sh.reduce((b, x) => (x.l > b.l ? x : b), sh[0]) : null,
               avgL: lastLI >= 0 ? gL / (lastLI + 1) : 0, l2r: gL > 0 ? (gRd + gRc) / gL * 100 : 0, exact: exactAll, cmp: null, range: true };
    }

    if (!cur) return null;
    const { L, Rd, Rc, uL, uRd, uRc } = cur;

    let last = 0, lastL = 0;                       // lastL: latest day that has leads (a day with only retails is not a full lead day)
    for (let i = 0; i < dim; i++) { if (L[i] > 0 || Rd[i] > 0 || Rc[i] > 0) last = i + 1; if (L[i] > 0) lastL = i + 1; }
    const days = [];
    for (let i = 0; i < dim; i++) {
      const rd = showD ? Rd[i] : 0, rc = showC ? Rc[i] : 0;
      days.push({ d: i + 1, wd: WD[new Date(year, mon - 1, i + 1).getDay()], l: L[i], rd, rc, r: rd + rc,

    }

    const dL  = shown.reduce((s, x) => s + x.l, 0);

          tooltip: {
            backgroundColor: 'rgba(11,22,41,.92)', titleColor: '#DBEAFE', bodyColor: '#93C5FD', footerColor: '#FDE68A', padding: 10, cornerRadius: 8,
            callbacks: {
              title: items => { const x = D[items[0].dataIndex]; return x.d + ' ' + MONTHS[(x.mo || view.mon) - 1] + ' ' + (x.yr || view.year) + ' (' + x.wd + ')'; },

          y: { stacked: true, grid: { color: 'rgba(100,116,139,.1)' }, ticks: { color: '#475569', font: { size: 10 } }, position: 'left', beginAtZero: true, title: { display: true, text: 'Volume', color: '#94a3b8', font: { size: 9 } } },

    if (view.uL > 0 || view.uR > 0) aoa.push([noDayLabel, '', view.uL, view.nRd, view.nRc, view.uR, '']);
    aoa.push(['\u2211 Total', '', view.tL, view.tRd, view.tRc, view.tR, +view.l2r.toFixed(2)]);

    const fname = 'TVS_DayOnDay_' + (rg ? rg[0] + '_to_' + rg[1] : sel.replace("'", '')) + (upd ? '_OnUpdate' : '_OnCreate');
    const ym = view.year * 100 + view.mon;
    if (!(dx && (rg ? view.exact : dx.months.includes(ym)))) { exportXlsx({ [base]: aoa }, fname); return; }

    const fl = [['TVS Day on Day export'], [],
      [rg ? 'Date range' : 'Month', periodTxt], ['Basis', upd ? 'On Update (leads on creation day; retails on retail/attribution day)' : 'On Create (retails on the creation day of the lead)'],
      ['Retail type shown', RT === 'dms' ? 'DMS only' : RT === 'co' ? 'Call Out (VOC) only' : 'DMS + Call Out (VOC)'],
      ['Lead Type', setTxt(filters.leadTypes, 'All')], ['Source', setTxt(filters.sources, 'All')], ['Model', setTxt(filters.models, 'All')],

      ['Leads', view.tL], ['Retail DMS', view.tRd], ['Retail VOC (Call Out)', view.tRc], ['Total Retail', view.tR], ['L2R%', +view.l2r.toFixed(2)], [],

      ['Note', 'Leads follow every filter except Purchased Model. When a Purchased Model is selected, retails follow it instead of the (enquired) Model filter. Data is aggregated (no lead-level rows).']];

    const A = dx.L, B = dx.R, K = upd ? B.ud : B.cd;

    const leadRows = [['Lead creation date', 'Model', 'Source', 'Lead Type', 'State', 'City', 'Leads']];
    const acc = { mdl: new Map(), src: new Map(), lt: new Map(), st: new Map(), city: new Map(), pm: new Map() };

      bump(acc.mdl, M.mdl[A.mi[i]], 0, A.n[i]); bump(acc.src, M.src[A.si[i]], 0, A.n[i]); bump(acc.lt, M.lt[A.lt[i]], 0, A.n[i]);
      bump(acc.st, M.st[A.st[i]], 0, A.n[i]); bump(acc.city, CN[A.ci[i]], 0, A.n[i]);
    }
    const retRows = [['Lead creation date', 'Retail date', 'Model (enquired)', 'Source', 'Lead Type', 'State', 'City', 'Purchased Model', 'Retail type', 'Retails']];

      retRows.push([dayTxt(B.cd[i]), dayTxt(B.ud[i]), M.mdl[B.mi[i]], M.src[B.si[i]], M.lt[B.lt[i]], M.st[B.st[i]], CN[B.ci[i]], M.mdl[B.pm[i]], rt, B.n[i]]);
      bump(acc.mdl, M.mdl[B.mi[i]], slot, B.n[i]); bump(acc.src, M.src[B.si[i]], slot, B.n[i]); bump(acc.lt, M.lt[B.lt[i]], slot, B.n[i]);
      bump(acc.st, M.st[B.st[i]], slot, B.n[i]); bump(acc.city, CN[B.ci[i]], slot, B.n[i]); bump(acc.pm, M.mdl[B.pm[i]], slot, B.n[i]);
    }
    const byDim = (title, m, withLeads) => {
      const rows = [...m.entries()].sort((x, y) => (y[1][0] + y[1][1] + y[1][2]) - (x[1][0] + x[1][1] + x[1][2]));
      const out = [withLeads ? [title, 'Leads', 'Retail DMS', 'Retail VOC (Call Out)', 'Total Retail', 'L2R%'] : [title, 'Retail DMS', 'Retail VOC (Call Out)', 'Total Retail']];
      let tl = 0, td = 0, tc = 0;
      for (const [k, v] of rows) {
        tl += v[0]; td += v[1]; tc += v[2];
        out.push(withLeads ? [k, v[0], v[1], v[2], v[1] + v[2], pct(v[0], v[1] + v[2])] : [k, v[1], v[2], v[1] + v[2]]);
      }
      out.push(withLeads ? ['\u2211 Total', tl, td, tc, td + tc, pct(tl, td + tc)] : ['\u2211 Total', td, tc, td + tc]);
      return out;
    };
    exportXlsx({
      'Filters': fl, [base]: aoa,
      'By Model': byDim('Model', acc.mdl, true), 'By Source': byDim('Source', acc.src, true), 'By Lead Type': byDim('Lead Type', acc.lt, true),
      'By State': byDim('State', acc.st, true), 'By City': byDim('City', acc.city, true),
      'By Purchased Model': byDim('Purchased Model', acc.pm, false),
      'Lead detail': leadRows, 'Retail detail': retRows,
    }, fname + '_AllData');
  };

  const navBtn = (label, disabled, onClick) => ce('button', {
    className: 'btn btn-secondary', disabled, onClick,
    style: { fontSize: 12, padding: '4px 12px', opacity: disabled ? .4 : 1, cursor: disabled ? 'default' : 'pointer' }
  }, label);

  const navCard = (withExport) => ce('div', { className: 'card', style: { padding: '12px 18px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' } },
      ce('div', { className: 'fs-10', style: { fontWeight: 700, color: '#94A3B8', textTransform: 'uppercase', letterSpacing: '.06em' } }, 'Month'),
      navBtn('◀', idx >= opts.length - 1, () => pickMonth(opts[idx + 1])),

        opts.map(m => ce('option', { key: m, value: m }, m))),

      rg && ce('button', { className: 'btn btn-secondary', onClick: () => { setRangeFrom(''); setRangeTo(''); }, style: { fontSize: 12, padding: '4px 12px' } }, 'Clear range'),
      ce('div', { style: { marginLeft: 'auto' } }, withExport ? ce(ExportBtn, { onClick: exportData }) : null)
    );

  const noteBar = ce('div', { style: { fontSize: 12, color: '#64748B', marginBottom: 14, padding: '8px 12px', background: '#F8FAFC', borderRadius: 8, border: '1px solid #E2E8F0' } },
      (upd
        ? '📅 On Update: leads are counted on the day they were created; retails on the day they were attributed (retail date), so the month total matches the Overview. '
        : '📅 On Create: leads are counted on the day they were created and retails are attributed to that creation day (recent days keep converting, so their L2R% rises). ') +
      (view.exact ? 'All filters apply. Purchased Model only affects retails, and when it is selected retails follow it instead of the Model filter (leads still follow Model).' : 'Model, Source, Lead Type and State filters apply' + (filtersNA ? ' — City and Purchased Model filters are available for the latest 4 months only (not for ' + sel + ')' : '') + '.'));

  const msgCard = (icon, title, body) => ce('div', { className: 'fade-up' }, noteBar, navCard(false),
    ce('div', { className: 'card', style: { padding: '40px 24px', textAlign: 'center', color: '#64748B' } },
      ce('div', { className: 'fs-32', style: { marginBottom: 10 } }, icon),
      ce('div', { className: 'fs-14', style: { fontWeight: 700, color: '#334155', marginBottom: 6 } }, title),
      ce('div', { className: 'fs-12', style: { maxWidth: 580, margin: '0 auto', lineHeight: 1.5 } }, body)));

  const totalsLine = 'For the selected filters the month total is ' + Nf(view.tL) + ' leads and ' + Nf(view.tR) + ' retails. ';

  // On Update before the pipeline has produced the retail-day table
  if (upd && !ddu.length) return msgCard('⏳', 'On Update daily detail will appear after the next pipeline run',
    'Switch to On Create to see the day-on-day view now.');
  // leads of this month cannot be placed on a day
  if (view.last === 0 && view.uL > 0 && view.dR === 0) return msgCard('🗓️', 'Daily detail is not available for ' + sel,
    'The source data for this month records only the lead month, not the day each lead was created. ' + totalsLine +
    "Apr'25 – Jan'26 and Jul'26 onwards have full daily detail.");
  // On Update: most of this month's retails carry no attribution day (history before the live retail sheet)
  if (upd && view.uR > view.dR) return msgCard('🗓️', 'On Update daily retail detail is not available for ' + sel,
    "The retail source only records the month for most of this month's retails, not the day. " + totalsLine +
    'Switch to On Create for the day-on-day view of this month, or pick Apr\'26 onwards for On Update.');
  if (view.last === 0) return msgCard('🔎', 'No leads for this selection in ' + sel, 'Try widening the Model, Source or Lead Type filters.');

  const KPIs = [
    { label: rg ? 'Leads (selected range)' : 'Leads (month to date)', value: Nf(view.tL), sub: view.last + ' day' + (view.last === 1 ? '' : 's') + ' of data', color: '#003087', dl: view.cmp && fmtDelta(view.cmp.leads, '%') },
    { label: upd ? 'Retails (by retail date)' : 'Retails (of leads created)', value: Nf(view.tR), sub: 'DMS ' + Nf(view.tRd) + ' · VOC ' + Nf(view.tRc), color: '#E31837', dl: view.cmp && fmtDelta(view.cmp.retails, '%') },
    { label: 'L2R %', value: view.l2r.toFixed(1) + '%', sub: 'Retails ÷ Leads', color: '#F5A623', dl: view.cmp && fmtDelta(view.cmp.l2r, ' pp') },
    { label: 'Avg leads / day', value: Nf(Math.round(view.avgL)), sub: 'over days with data', color: '#7C3AED', dl: view.cmp && fmtDelta(view.cmp.avg, '%') },
    { label: 'Peak day', value: view.peak ? Nf(view.peak.l) : '—', sub: view.peak ? view.peak.d + ' ' + MONTHS[(view.peak.mo || view.mon) - 1] + ' (' + view.peak.wd + ')' : '', color: '#059669', dl: view.cmp && fmtDelta(view.cmp.peak, '%') },
  ];

  return ce('div', { className: 'fade-up' },
    noteBar,
    navCard(true),
    ce('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(175px,1fr))', gap: 10, marginBottom: 20 } },
      KPIs.map((k, i) => ce('div', { key: i, className: 'kpi' },
        ce('div', { style: { position: 'absolute', top: 0, left: 0, right: 0, height: 3, background: k.color, borderRadius: '12px 12px 0 0' } }),
        ce('div', { className: 'kpi-label' }, k.label),
        ce('div', { className: 'kpi-value' + (k.value.length > 7 ? ' kpi-long' : ''), style: { color: k.color } }, k.value),
        ce('div', { className: 'kpi-sub', style: { color: k.color } }, k.sub),
        k.dl && ce('div', { style: { marginTop: 5, fontSize: 11, fontWeight: 700, color: k.dl.up ? '#059669' : '#DC2626' } },
          k.dl.txt, ce('span', { style: { fontWeight: 500, color: '#94A3B8' } }, ' vs ' + view.cmp.label))
      ))
    ),
    ce('div', { className: 'card', style: { padding: '16px 18px', marginBottom: 14 } },
      ce('div', { className: 'section-title' }, 'Day-on-Day — ' + periodTxt + ': Leads, Retails (DMS / VOC) & L2R%' + (upd ? ' · On Update' : ' · On Create')),
      ce('div', { style: { height: 300, position: 'relative' } }, ce('canvas', { ref: chartRef }))
    ),
    ce('div', { className: 'card', style: { padding: '16px 18px', marginBottom: 14 } },
      ce('div', { className: 'section-title' }, 'Daily detail — ' + periodTxt),
      ce('div', { className: 'scroll-x' },
        ce('table', null,
          ce('thead', null, ce('tr', null,
            ce('th', { className: 'left', style: { minWidth: 130 } }, 'Date'),
            ce('th', null, 'Leads'),
            ce('th', { style: { color: '#E31837' } }, 'Retail DMS'),
            ce('th', { style: { color: '#7C3AED' } }, 'Retail VOC'),
            ce('th', null, 'Total Retail'),
            ce('th', null, 'L2R%'))),
          ce('tbody', null,
            ...view.shown.map(x => ce('tr', { key: (x.yr || 0) + '-' + (x.mo || 0) + '-' + x.d },
              ce('td', { className: 'label' }, x.d + ' ' + MONTHS[(x.mo || view.mon) - 1] + (rg ? ' ' + x.yr : '') + ', ' + x.wd),
              ce('td', null, Nf(x.l)),
              ce('td', { style: { color: '#E31837', fontWeight: 700 } }, Nf(x.rd)),
              ce('td', { style: { color: '#7C3AED', fontWeight: 700 } }, Nf(x.rc)),
              ce('td', { style: { fontWeight: 700 } }, Nf(x.r)),
              ce('td', null, x.l > 0 ? Pf(x.l2r) : '—'))),
            (view.uL > 0 || view.uR > 0) && ce('tr', { key: 'noday' },
              ce('td', { className: 'label', style: { color: '#94A3B8' } }, noDayLabel),
              ce('td', null, Nf(view.uL)),
              ce('td', { style: { color: '#E31837', fontWeight: 700 } }, Nf(view.nRd)),
              ce('td', { style: { color: '#7C3AED', fontWeight: 700 } }, Nf(view.nRc)),
              ce('td', { style: { fontWeight: 700 } }, Nf(view.uR)),
              ce('td', null, '—')),
            ce('tr', { className: 'total-row' },
              ce('td', { className: 'label' }, '∑ Total'),
              ce('td', null, Nf(view.tL)),
              ce('td', { style: { color: '#E31837', fontWeight: 700 } }, Nf(view.tRd)),
              ce('td', { style: { color: '#7C3AED', fontWeight: 700 } }, Nf(view.tRc)),
              ce('td', null, Nf(view.tR)),
              ce('td', null, Pf(view.l2r)))
          )
        )
      ),
      (view.uL > 0 || view.uR > 0) && ce('div', { style: { marginTop: 8, fontSize: 11, color: '#94A3B8' } },
        (upd
          ? '"' + noDayLabel + '" holds retails whose attribution date falls in the neighbouring month — mostly DMS retails dated the 1st of the next month, which the Overview credits to this month (month-close) — plus any without a day. They are included in the total so the month ties to the Overview.'
          : '"No day recorded" holds leads and retails whose source has no usable date for this month; they are included in the totals so the month ties to the Overview.'))
    )
  );
});

/* ════════════════════════════════════════════════════════════════════
   LEAD → RETAIL TAT TAB  (admins only, lead-creation basis)
   Summary : one row per lead month. Leads, retailed, open, conversion; turnaround (median / average / P90 / within 7 days);
             retails by retail month (same month, next month, ...).
             Retail months come from data.pmx (lead month x retail month, every filter). Turnaround days come from the day-level
             detail file (latest 4 lead months only: older months have no lead / retail dates).
   Matrix  : lead day (rows) x retail day (columns) for one month, from the day-level detail file.
   ════════════════════════════════════════════════════════════════════ */
const TatTab = React.memo(function TatTab({ data, filters, months, RT }) {
  const { maps } = data;
  const has = s => !!(s && s.size);
  const CAP = 11;                                   // retail-month columns: M+0 ... M+11 (M+11 also holds anything later)
  const ymOf  = lbl => { const x = /([A-Za-z]+)'(\d+)/.exec(lbl || ''); return x ? (2000 + +x[2]) * 100 + MONTHS.indexOf(x[1]) + 1 : 0; };
  const ordOf = lbl => { const x = /([A-Za-z]+)'(\d+)/.exec(lbl || ''); return x ? (2000 + +x[2]) * 12 + MONTHS.indexOf(x[1]) : -1; };
  const dser  = d => Date.UTC(Math.floor(d / 10000), Math.floor(d / 100) % 100 - 1, d % 100) / 864e5;

  const [daily, setDaily] = useState(null);
  useEffect(() => {
    let live = true;
    loadDailyDetail().then(d => { if (live) setDaily(d && d.t === data.t ? d : false); });
    return () => { live = false; };
  }, [data.t]);
  const dx = useMemo(() => (daily ? { ...daily, cityName: daily.maps.city.map(c => canonicalCity(c)) } : null), [daily]);

  const opts = useMemo(() => (months || []).filter(m => m && m !== '\x00'), [months]);
  const [sel, setSel] = useState(opts[0] || '');
  useEffect(() => { if (opts.length && !opts.includes(sel)) setSel(opts[0]); }, [opts]);
  const [showDays, setShowDays] = useState(false);   // day-by-day grid: the retail-day columns start collapsed

  const hasPmx = !!(data.pmx && data.pmx.length);
  const cityOn = has(filters.cities);

  // ── Summary rows ──────────────────────────────────────────────────
  const summary = useMemo(() => {
    if (!opts.length || !hasPmx) return null;
    const mset = new Set(opts);
    const lmOk = maps.lm.map(l => mset.has(l));
    const okS  = maps.src.map(n => !has(filters.sources)   || filters.sources.has(n));
    const okM  = maps.mdl.map(n => !has(filters.models)    || filters.models.has(n));
    const okT  = maps.lt.map(n => !has(filters.leadTypes)  || filters.leadTypes.has(n));
    const okSt = maps.st.map(n => !has(filters.states)     || filters.states.has(n));
    const okC  = (maps.city || []).map(n => !cityOn || filters.cities.has(n));
    const pmSel = has(filters.purchasedModels) ? resolvePmIdx(filters.purchasedModels, maps) : null;

    // leads by lead month (every filter except Purch. Model; with a City filter only Model / Source / State / City apply)
    const L = new Map();
    if (!cityOn) {
      for (const r of (data.univ || [])) {                          // [mi, si, sti, tti, li, L, ...]
        if (!lmOk[r[4]] || !okM[r[0]] || !okS[r[1]] || !okSt[r[2]] || !okT[r[3]]) continue;
        L.set(r[4], (L.get(r[4]) || 0) + r[5]);
      }
    } else {
      for (const r of (data.cxsm || [])) {                          // [cti, si, mi, li, L, ...]
        if (!lmOk[r[3]] || !okC[r[0]] || !okS[r[1]] || !okM[r[2]]) continue;
        if (has(filters.states)) { const s = (maps.city_state || [])[r[0]]; if (s == null || !okSt[s]) continue; }
        L.set(r[3], (L.get(r[3]) || 0) + r[4]);
      }
    }

    // retails by lead month and retail month offset (pmx v2: [pmi, mi, si, sti, tti, cti, dli, li, uli, R, Rd, Rc])
    const o = (data.pmx_v || 1) >= 2 ? 1 : 0, ri = 8 + o + (RT === 'dms' ? 1 : RT === 'co' ? 2 : 0);
    const K = new Map();                                            // li -> array(CAP + 1)
    let kmax = 0;
    for (const x of data.pmx) {
      const li = x[6 + o];
      if (!lmOk[li]) continue;
      if (pmSel ? !pmSel.has(x[0]) : !okM[x[1]]) continue;           // a Purch. Model selection replaces the enquired-Model filter for retails
      if (!okS[x[2]] || !okSt[x[3]] || !okT[x[4]] || !okC[x[5]]) continue;
      const v = x[ri]; if (!v) continue;
      const k = Math.min(CAP, Math.max(0, ordOf(maps.lm[x[7 + o]]) - ordOf(maps.lm[li])));
      let a = K.get(li); if (!a) { a = new Array(CAP + 1).fill(0); K.set(li, a); }
      a[k] += v; if (k > kmax) kmax = k;
    }

    // turnaround days (exact, day-level detail file; latest 4 lead months)
    const ymSel = new Set(opts.map(ymOf));
    const ST = new Map();                                           // ym -> { n, sum, hist, noDate }
    if (dx) {
      const P = dailyPreds(dx, filters, maps), B = dx.R;
      for (let i = 0; i < B.n.length; i++) {
        const cym = Math.floor(B.cd[i] / 100);
        if (!ymSel.has(cym) || !dx.months.includes(cym) || B.rt[i] === 2) continue;
        if (B.rt[i] === 0 ? RT === 'co' : RT === 'dms') continue;
        if (!((P.pmSel || P.okM[B.mi[i]]) && P.okS[B.si[i]] && P.okT[B.lt[i]] && P.okSt[B.st[i]] && P.okC[B.ci[i]])) continue;
        if (P.pmSel && !P.pmSel.has(B.pm[i])) continue;
        let e = ST.get(cym); if (!e) { e = { n: 0, sum: 0, w7: 0, hist: new Map(), noDate: 0 }; ST.set(cym, e); }
        if (B.cd[i] % 100 === 0 || B.ud[i] % 100 === 0) { e.noDate += B.n[i]; continue; }
        const t = Math.round(dser(B.ud[i]) - dser(B.cd[i]));
        if (t < 0) { e.noDate += B.n[i]; continue; }
        e.n += B.n[i]; e.sum += t * B.n[i]; if (t <= 7) e.w7 += B.n[i];
        e.hist.set(t, (e.hist.get(t) || 0) + B.n[i]);
      }
    }
    const finish = e => {
      if (!e || !e.n) return null;
      const keys = [...e.hist.keys()].sort((a, b) => a - b);
      const at = q => { let c = 0; for (const k of keys) { c += e.hist.get(k); if (c >= q * e.n) return k; } return keys[keys.length - 1]; };
      return { n: e.n, avg: e.sum / e.n, med: at(0.5), p90: at(0.9), w7: e.w7 / e.n * 100, noDate: e.noDate };
    };

    const rows = [];
    opts.forEach(m => {
      const li = maps.lm.indexOf(m);
      const leads = L.get(li) || 0, ks = K.get(li) || new Array(CAP + 1).fill(0);
      const ret = ks.reduce((s, v) => s + v, 0);
      if (!leads && !ret) return;
      rows.push({ m, ym: ymOf(m), leads, ret, open: Math.max(0, leads - ret), conv: leads > 0 ? ret / leads * 100 : 0, ks, st: finish(ST.get(ymOf(m))) });
    });
    const agg = new Map();                                          // overall turnaround across the months that have day detail
    for (const e of ST.values()) {
      let g = agg.get('all'); if (!g) { g = { n: 0, sum: 0, w7: 0, hist: new Map(), noDate: 0 }; agg.set('all', g); }
      g.n += e.n; g.sum += e.sum; g.w7 += e.w7; g.noDate += e.noDate;
      for (const [t, c] of e.hist) g.hist.set(t, (g.hist.get(t) || 0) + c);
    }
    const tl = rows.reduce((s, r) => s + r.leads, 0), tr = rows.reduce((s, r) => s + r.ret, 0);
    return { rows, kmax, total: { leads: tl, ret: tr, conv: tl > 0 ? tr / tl * 100 : 0 }, overall: finish(agg.get('all')), tatMonths: [...ST.keys()].length };
  }, [data, filters, opts, RT, dx, hasPmx, cityOn, maps]);

function _initFS() {
  try { const v = localStorage.getItem(_FS_KEY); if (v && _FS_SCALE[v] !== undefined) return v; } catch(e) {}
  return 'default';
}

function App() {
  // ── Auth state (must be before any early returns) ──────────────────

    try { const s = sessionStorage.getItem(AUTH_SESSION_KEY); return s ? JSON.parse(s) : null; }
