name: Deploy TVS Lead Disposition Dashboard

on:
  push:
    branches: [main]
  # The daily data-push workflow commits with the default GITHUB_TOKEN, and
  # GitHub's loop-guard means token-authored pushes never trigger other
  # `on: push` workflows. Without this, Pages only redeploys after a human
  # pushes a code change — the payload commits from tvs-data-push.yml would
  # silently never reach the live dashboard. workflow_run is NOT subject to
  # that guard, so this is the actual daily-refresh path.
  workflow_run:
    workflows: ["TVS Daily Data Push"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # For workflow_run triggers, only deploy if the data push actually succeeded
    # (a dry-run or failed run has nothing new worth deploying).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp _site/index.html _site/404.html
          [ -f data/tvs_payload.json.gz ] && { mkdir -p _site/data && cp data/tvs_payload.json.gz _site/data/tvs_payload.json.gz; } || echo "TVS data not yet available, skipping"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
