name: Diagnose retail sources (temporary)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - run: python TVS/diag_retail.py
        env:
          TVS_PUSH_SECRET: ${{ secrets.TVS_PUSH_SECRET }}
